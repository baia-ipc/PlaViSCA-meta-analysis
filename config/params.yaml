# Analysis parameters of the PlaViSca preprocessing pipeline.
# Every stage reads its parameters from here; stage 70 copies them into
# results/tables_and_values/parameters.tsv.

reference:
  gff: reference/PlasmoDB-68_PvivaxP01.gff
  annotation_release: PlasmoDB-68 PvivaxP01

# Stage 10: how the cells of each study are obtained.
#   matrix:      STARsolo GeneFull matrix to read ("filtered" or "raw")
#   min_cells / min_features: CreateSeuratObject() filters
#   emptydrops:  droplet calling on the raw matrix (only Hazzard2022)
import:
  # folder of the STARsolo outputs, under <workspace>/inputs/
  starsolo_counts: starsolo_counts
  Sa2020:
    source: starsolo
    matrix: filtered
    min_cells: 1
    min_features: 1
  Hazzard2022:
    source: starsolo
    matrix: raw
    min_cells: 1
    min_features: 1
    emptydrops:
      lower: 1
      fdr: 0.001
      seed: 123456
  Hazzard2024:
    source: starsolo
    matrix: raw
    min_cells: 1
    min_features: 1
    author_cells: author_data/Proccessed_Data.txt
  Ruberto2022_2:
    source: starsolo
    matrix: raw
    min_cells: 0
    min_features: 0
    author_cells: author_data/6_PvSPZ.BS.combined.rds
  Ruberto2022_1:
    source: author_matrix
    object: author_data/Hep59.1.2.seu_20aug2025.rds
  Mancio-Silva2022:
    source: author_matrix
    object: author_data/PvData_CHM_Final.RDS
    cell_table: author_data/TableS2_Cell_Metadata.xls

# Stage 30: merge, normalisation, integration, embeddings, clustering.
integration:
  # Order in which the studies are merged. It sets the order of the cells
  # and therefore affects the random numbers of the later steps.
  merge_order: [Hazzard2022, Hazzard2024, Ruberto2022_1, Ruberto2022_2, Sa2020, Mancio-Silva2022]
  n_variable_genes: 2000
  variable_gene_method: vst
  n_pcs_used: 30
  umap_components: 3
  tsne_components: 3
  tsne_seed: 123
  cluster_resolutions: {from: 0.01, to: 0.10, by: 0.01}
  umap_seed: 42        # Seurat default
  pca_seed: 42         # Seurat default
  threads: 10

# Stage 35: embedding and clusters of the blood-stage cells.
blood_embedding:
  n_variable_genes: 2000
  n_pcs_used: 15
  # neighbours of the graph the clusters are built on
  n_neighbours: 50
  # layout of the UMAP
  umap_neighbours: 100
  umap_min_dist: 0.5
  seed: 42
  cluster_resolution: 1

# Stage 40: stage annotation.
annotation:
  idc_reference: reference/Zhu_SciReps_2016.xls
  idc_reference_sheet: SMRU1
  idc_orthologs: reference/GenesByOrthologs_Summary.xlsx
  idc_min_umi: 300
  # The stage assigned to each reference time point: metadata/idc_timepoints.tsv
  sa2020_gametocytes: author_data/pbio.3000711.s034.xlsx
  # resolution of the atlas-wide clusters exported as `cluster` (stage 30)
  atlas_cluster_resolution: 0.05
  # Gametocytes are called per cluster of stage 35 (blood_cluster), on the
  # mean module scores of metadata/gametocyte_markers.tsv over the cluster:
  #   female branch: female >= female_min_score and >= male + min_margin
  #   male branch:   male >= male_min_score and >= female + min_margin
  #   late male:     male branch and male_mature >= late_male_min_score
  #   developing gametocyte (sex not called; stage "Developing gametocyte"):
  #                  female branch with median UMIs < developing_max_umi, or
  #                  with mean male score >= undecided_min_male_score (cells
  #                  where the branch splits towards the male arm)
  #   late female:   female branch with median UMIs >= late_female_min_umi
  #   early female:  the other female-branch clusters
  gametocyte_female_min_score: 0.10
  gametocyte_male_min_score: 0.30
  gametocyte_min_margin: 0.05
  late_male_min_score: 0.20
  developing_max_umi: 500
  undecided_min_male_score: 0.10
  late_female_min_umi: 3000

# Stage 60: integration assessment.
assessment:
  seed: 1
  n_cells: 8000
  k_neighbours: 30
  n_pcs: 30
  max_cells_per_stage: 3000
