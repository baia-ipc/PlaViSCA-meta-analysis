# Analysis parameters of the PlaViSca preprocessing pipeline.
# Every stage reads its parameters from here; stage 70 copies them into
# results/tables_and_values/parameters.tsv.

reference:
  gff: reference/PlasmoDB-68_PvivaxP01.gff
  annotation_release: PlasmoDB-68 PvivaxP01

# Stage 10: how the cells of each study are obtained.
#   matrix:      STARsolo GeneFull matrix to read ("filtered" or "raw")
#   min_cells / min_features: CreateSeuratObject() filters
#   min_genome_reads: cells are the barcodes with at least this many unique
#                reads over the whole genome, by tissue (only Hazzard2022)
import:
  # folder of the STARsolo outputs, under <workspace>/inputs/
  starsolo_counts: starsolo_counts
  # cores used to read the runs of a study in parallel
  threads: 8
  Sa2020:
    source: starsolo
    matrix: raw
    min_cells: 1
    min_features: 1
    # the cells of the authors' main analysis
    # (metadata/sa2020_main_analysis_cells.tsv)
    main_analysis_cells: true
  Hazzard2022:
    source: starsolo
    matrix: raw
    min_cells: 1
    min_features: 1
    min_genome_reads:
      Host blood: 5000
      Vector salivary gland: 250
  Hazzard2024:
    source: starsolo
    matrix: raw
    min_cells: 1
    min_features: 1
    author_cells: author_data/Proccessed_Data.txt
  Ruberto2022_2:
    source: starsolo
    matrix: raw
    min_cells: 0
    min_features: 0
    author_cells: author_data/6_PvSPZ.BS.combined.rds
  Ruberto2022_1:
    source: author_matrix
    object: author_data/Hep59.1.2.seu_20aug2025.rds
  Mancio-Silva2022:
    source: author_matrix
    object: author_data/PvData_CHM_Final.RDS
    cell_table: author_data/TableS2_Cell_Metadata.xls

# Stage 30: merge, normalisation, integration, embeddings, clustering.
integration:
  # Order in which the studies are merged. It sets the order of the cells
  # and therefore affects the random numbers of the later steps.
  merge_order: [Hazzard2022, Hazzard2024, Ruberto2022_1, Ruberto2022_2, Sa2020, Mancio-Silva2022]
  n_variable_genes: 2000
  variable_gene_method: vst
  n_pcs_used: 30
  umap_components: 3
  tsne_components: 3
  tsne_seed: 123
  cluster_resolutions: {from: 0.01, to: 0.10, by: 0.01}
  umap_seed: 42        # Seurat default
  pca_seed: 42         # Seurat default
  threads: 10

# Stage 35: embedding and clusters of the blood-stage cells.
blood_embedding:
  n_variable_genes: 2000
  n_pcs_used: 15
  # neighbours of the graph the clusters are built on
  n_neighbours: 50
  # layout of the UMAP
  umap_neighbours: 100
  umap_min_dist: 0.5
  seed: 42
  cluster_resolution: 1

# Stage 40: stage annotation.
annotation:
  idc_reference: reference/Zhu_SciReps_2016.xls
  idc_reference_sheet: SMRU1
  idc_orthologs: reference/GenesByOrthologs_Summary.xlsx
  idc_min_umi: 300
  # The stage assigned to each reference time point: metadata/idc_timepoints.tsv
  sa2020_gametocytes: author_data/pbio.3000711.s034.xlsx
  # resolution of the atlas-wide clusters exported as `cluster` (stage 30)
  atlas_cluster_resolution: 0.05
  # Gametocytes are called per cluster of stage 35 (blood_cluster), from the
  # marker sets of metadata/gametocyte_markers.tsv (female, male, and the
  # mature-male panel). Enrichment of a set in a cluster: share of the
  # cluster's cells detecting the set's genes minus the share detecting
  # control genes of similar expression, in percentage points
  # (marker_control_genes per marker gene, from marker_expression_bins bins
  # of mean expression). Relative UMIs: the cluster's median UMIs divided by
  # the median over the clusters. Neither depends on sequencing depth.
  #   female branch: female >= gametocyte_min_enrichment and female > male
  #   male branch:   male >= gametocyte_min_enrichment, male > female and
  #                  mature-male >= male_min_mature_enrichment (some schizont
  #                  clusters detect part of the male set)
  #   late male:     male branch with mature-male >= late_male_min_enrichment
  #   early male:    the other male-branch clusters
  #   developing gametocyte (sex not called; stage "Developing gametocyte"):
  #                  female branch with relative UMIs < developing_max_rel_umi
  #   late female:   female branch with relative UMIs >= late_female_min_rel_umi
  #   early female:  the other female-branch clusters
  marker_expression_bins: 25
  marker_control_genes: 100
  marker_control_seed: 1
  gametocyte_min_enrichment: 10
  male_min_mature_enrichment: 5
  late_male_min_enrichment: 20
  developing_max_rel_umi: 0.4
  late_female_min_rel_umi: 1.5

# Stage 60: integration assessment.
assessment:
  seed: 1
  n_cells: 8000
  k_neighbours: 30
  n_pcs: 30
  max_cells_per_stage: 3000
